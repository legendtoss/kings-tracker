name: King's cash game tracker

on:
  workflow_dispatch:                # started every 10 min by cron-job.org (and by the "Run workflow" button)
  schedule:
    - cron: "17 * * * *"            # hourly backup in case the outside timer ever stops

permissions:
  contents: write                   # lets the job save its results into this repository

concurrency:
  group: kings-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803      # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Check King's and update the stats
        run: python tracker.py

      - name: Save results
        if: ${{ !cancelled() }}     # saves the data even when the check step reports a problem
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Snapshot $(TZ=Europe/Prague date +'%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((attempt * 10))
          done
          exit 1
